<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AI Recipes</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">AI Recipes</div>
        <div class="nav-links">
            <a href="/dashboard" class="active">Dashboard</a>
        </div>
    </nav>

    <main class="dashboard">
        <h1>Dashboard</h1>
        <div class="dashboard-grid">
            <div class="card">
                <h2>My Recipes</h2>
                <p class="card-stat">12</p>
                <p class="card-label">Total recipes created</p>
            </div>
            <div class="card">
                <h2>Favorites</h2>
                <p class="card-stat">5</p>
                <p class="card-label">Saved favorites</p>
            </div>
            <div class="card">
                <h2>Recent</h2>
                <p class="card-stat">3</p>
                <p class="card-label">Generated this week</p>
            </div>
        </div>
    </main>

    <!-- Feedback Widget -->
    <div id="feedback-widget" class="feedback-widget">
        <button id="feedback-toggle" class="feedback-toggle" aria-label="Give feedback">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 9.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L2 18.5l1.4-3.7A8.38 8.38 0 012.5 11a8.5 8.5 0 014.7-7.6A8.38 8.38 0 0111 2.5h.5A8.48 8.48 0 0118 9.5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <div id="feedback-panel" class="feedback-panel" aria-hidden="true">
            <div class="feedback-header">
                <h3>Send Feedback</h3>
                <button id="feedback-close" class="feedback-close" aria-label="Close feedback">&times;</button>
            </div>
            <form id="feedback-form" class="feedback-form">
                <label class="feedback-label">How would you rate this page?</label>
                <div class="feedback-stars" role="radiogroup" aria-label="Rating">
                    <button type="button" class="star-btn" data-rating="1" aria-label="1 star">&#9733;</button>
                    <button type="button" class="star-btn" data-rating="2" aria-label="2 stars">&#9733;</button>
                    <button type="button" class="star-btn" data-rating="3" aria-label="3 stars">&#9733;</button>
                    <button type="button" class="star-btn" data-rating="4" aria-label="4 stars">&#9733;</button>
                </div>
                <label class="feedback-label" for="feedback-comment">Comments (optional)</label>
                <textarea id="feedback-comment" class="feedback-textarea" rows="3" placeholder="Tell us what you think..."></textarea>
                <button type="submit" class="feedback-submit" disabled>Submit</button>
            </form>
            <div id="feedback-success" class="feedback-success" hidden>
                <p>Thank you for your feedback! 🎉</p>
            </div>
        </div>
    </div>

    <script src="/static/feedback.js"></script>
</body>
</html>
